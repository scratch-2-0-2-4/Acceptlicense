[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "acceptlicense"
version = "0.1.0"
description = "Un outil simple pour gérer et accepter les licences logicielles."
readme = "README.md"
authors = [
    { name = "Scratch_2_0_2_4", email = "scratch.20.24.0@gmail.com" }
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.7"
dependencies = [
    "pytz",
]